version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-crm_db}
      POSTGRES_USER:     ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./ai-crm-platform
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/${POSTGRES_DB:-crm_db}
      MONGO_URL:    mongodb://mongo:27017
      REDIS_URL:    redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY:   ${GROQ_API_KEY:-}
      API_KEY:        ${API_KEY}
      GROQ_MODEL:     ${GROQ_MODEL:-qwen/qwen3.8-27b}
    depends_on:
      - postgres
      - mongo
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./ai-crm-platform
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=4
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/${POSTGRES_DB:-crm_db}
      MONGO_URL:    mongodb://mongo:27017
      REDIS_URL:    redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY:   ${GROQ_API_KEY:-}
      API_KEY:        ${API_KEY}
      GROQ_MODEL:     ${GROQ_MODEL:-qwen/qwen3.8-27b}
    depends_on:
      - redis
      - postgres
      - mongo

  react:
    build:
      context: ./crm-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PROD_API_URL}
        VITE_API_KEY: ${API_KEY}
    restart: always
    ports:
      - "80:80"

volumes:
  postgres_data:
  mongo_data:
  redis_data:
